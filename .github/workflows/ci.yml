name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest -v
        # tests/test_dashboard_smoke.py boots the real Streamlit app via
        # streamlit.testing.v1.AppTest and drives it through both flows
        # (generate -> review -> approve, and cluster), so a dedicated
        # "does the dashboard boot" step would just repeat that coverage.
